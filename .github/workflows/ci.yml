name: happ-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: wasm build (workspace)
        run: cargo build --target wasm32-unknown-unknown --workspace
      - name: unit tests (integrity domain)
        run: cargo test -p zome_integrity
      - name: P2.2B in-process SweetConductor reconstruction
        run: cargo test --manifest-path integration_tests/Cargo.toml --test conductor -- --nocapture
      # The CI proof uses Holochain SweetConductor in-process with the exact wasm
      # artifacts built from this branch. The standalone AppWebsocket/sandbox proof
      # remains an operational acceptance step in ops-docs.
