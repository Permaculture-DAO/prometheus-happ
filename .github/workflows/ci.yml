name: happ-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: wasm build (workspace)
        run: cargo build --target wasm32-unknown-unknown --workspace
      - name: unit tests (integrity domain)
        run: cargo test -p zome_integrity
      # .cargo/config.toml carries -C link-arg=--allow-undefined so the conductor
      # host functions (__hc__*) remain wasm imports. Conductor smoke test is a
      # local/manual runbook step (ops-docs), not run in CI.

  dep01d-pinned-wasm:
    name: DEP-01D independently rebuild deployed WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/dep01d-wasm-build
      # Match registry source path used for the installed historical WASM.
      CARGO_HOME: /home/giova/.cargo
    steps:
      - name: Checkout historical immutable release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 2e84d3a3f69ade0481cd5c778f98a9a68d82af6d
          fetch-depth: 1
          persist-credentials: false
      - name: Validate source, Cargo lock and repository config
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2e84d3a3f69ade0481cd5c778f98a9a68d82af6d"
          echo 'd92609a15c9ca9d37280cce74fd26f5fedc3268abfd92e0b16580bee42ef11a9  Cargo.lock' | sha256sum -c -
          grep -Fq 'getrandom_backend="unsupported"' .cargo/config.toml
          grep -Fq -- '--allow-undefined' .cargo/config.toml
          test -z "$(git status --porcelain=v1)"
      - name: Install exact original Rust version and WASM target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
          test "$(rustc +1.96.0 --version)" = "rustc 1.96.0 (ac68faa20 2026-05-25)"
      - name: Prepare historical Cargo registry source location on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          # GitHub runner is ephemeral; never change on-device/production paths.
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /home/giova /home/giova/.cargo
          test "$CARGO_HOME" = "/home/giova/.cargo"
          test -w "$CARGO_HOME"
          echo "DEP01E_CARGO_HOME_PATH_PIN: PASS"
      - name: Build offline-recorded source with versioned Cargo config
        shell: bash
        run: |
          set -euo pipefail
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS || true
          cargo +1.96.0 build --locked --release --target wasm32-unknown-unknown -p zome_integrity -p zome_coordinator
      - name: Fail-closed compare to installed bundle WASM byte hashes
        shell: bash
        run: |
          set -euo pipefail
          cd "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release"
          # Diagnostics contain only public WASM digests and sizes; never print environment/secrets.
          sha256sum zome_integrity.wasm zome_coordinator.wasm
          wc -c zome_integrity.wasm zome_coordinator.wasm
          # Read-only section hashes to distinguish code from non-semantic metadata.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def leb(blob,pos):
              num=0
              for offset in range(7):
                  b=blob[pos]
                  pos+=1
                  num|=(b&127)<<(7*offset)
                  if b<128:return num,pos
              raise ValueError("bad varuint")
          for name in ("zome_integrity.wasm","zome_coordinator.wasm"):
              blob=Path(name).read_bytes()
              if blob[:8]!=bytes.fromhex("0061736d01000000"):raise ValueError("invalid wasm")
              i=8
              while i<len(blob):
                  section=blob[i]
                  i+=1
                  size,i=leb(blob,i)
                  data=blob[i:i+size]
                  i+=size
                  title=""
                  if section==0:
                      n,j=leb(data,0)
                      title=data[j:j+n].decode("utf8","replace")
                  print("DEP01D_SECTION",name,"id",section,"name",title,
                        "bytes",len(data),"sha256",hashlib.sha256(data).hexdigest())
          PY
          echo '3089b324b51c0d1e88c5c8e2652a60762be30d9c92a7f3b0ca8e57e032a9ce98  zome_integrity.wasm' | sha256sum -c -
          echo '6b93a978f45fc1c4c8a9376fde9f605f84570a823d1154e15eff58b8db284370  zome_coordinator.wasm' | sha256sum -c -
          echo 'DEP01D_EXTERNAL_RUNNER_ARTIFACT_MATCH'
