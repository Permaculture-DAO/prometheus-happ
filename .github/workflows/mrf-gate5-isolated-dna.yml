name: mrf-gate5-isolated-dna
on:
  push:
    paths:
      - "experimental/mrf-kernel-lab/**"
      - ".github/workflows/mrf-gate5-isolated-dna.yml"
  pull_request:
    paths:
      - "experimental/mrf-kernel-lab/**"
      - ".github/workflows/mrf-gate5-isolated-dna.yml"
permissions:
  contents: read
# Exact synthetic-only release-candidate bytes observed on independent CI runners.
# Changing the laboratory DNA/zomes requires a separately reviewed hash update.
env:
  G5_EXPECTED_COORDINATOR_SHA256: f490b2f89eb810de9913a5c8bd153402567032f2ba6c43f1109cf58c9064af7f
  G5_EXPECTED_INTEGRITY_SHA256: 633e905171d133a204c3bfca3e8ee15794c80676d22631c68c7d9f4dd9cb8581
  G5_EXPECTED_DNA_SHA256: 739d1fb6ffb1f61de14c187a27f926366ba9ed88fdd2057b72503c871ebc779f
jobs:
  pack-isolated-test-dna:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      HC_RELEASE: holochain-0.6.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - name: Compile TEST-only integrity and coordinator WASM
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path experimental/mrf-kernel-lab/zome_integrity_lab/Cargo.toml
          cargo generate-lockfile --manifest-path experimental/mrf-kernel-lab/zome_coordinator_lab/Cargo.toml
          cargo build --manifest-path experimental/mrf-kernel-lab/zome_integrity_lab/Cargo.toml --locked --release --target wasm32-unknown-unknown
          cargo build --manifest-path experimental/mrf-kernel-lab/zome_coordinator_lab/Cargo.toml --locked --release --target wasm32-unknown-unknown
      - name: Download and check official Holochain CLI v0.6.1
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/holochain_061_release.json"
          gh api "repos/holochain/holochain/releases/tags/$HC_RELEASE" > "$release_json"
          jq -r '[.assets[].name | select(startswith("hc-x86_64-unknown-linux-gnu"))] | .[]' "$release_json"
          asset="$(jq -r '[.assets[].name | select(. == "hc-x86_64-unknown-linux-gnu" or . == "hc-x86_64-unknown-linux-gnu.gz" or . == "hc-x86_64-unknown-linux-gnu.tar.gz")] | if length == 1 then .[0] else empty end' "$release_json")"
          test -n "$asset" || { echo "::error::Could not unambiguously select official hc Linux binary"; exit 1; }
          expected="$(jq -r --arg a "$asset" '.assets[] | select(.name == $a) | .digest // empty' "$release_json")"
          [[ "$expected" == sha256:* ]] || { echo "::error::Missing upstream SHA256 digest; fail closed"; exit 1; }
          mkdir -p "$RUNNER_TEMP/mrf-hc"
          gh release download "$HC_RELEASE" --repo holochain/holochain --pattern "$asset" --dir "$RUNNER_TEMP/mrf-hc"
          got="sha256:$(sha256sum "$RUNNER_TEMP/mrf-hc/$asset" | cut -d' ' -f1)"
          test "$got" = "$expected" || { echo "::error::Upstream hc artifact hash mismatch"; exit 1; }
          case "$asset" in
            *.tar.gz) tar -xzf "$RUNNER_TEMP/mrf-hc/$asset" -C "$RUNNER_TEMP/mrf-hc" ;;
            *.gz) gzip -dc "$RUNNER_TEMP/mrf-hc/$asset" > "$RUNNER_TEMP/mrf-hc/hc" ;;
            *) cp "$RUNNER_TEMP/mrf-hc/$asset" "$RUNNER_TEMP/mrf-hc/hc" ;;
          esac
          test -f "$RUNNER_TEMP/mrf-hc/hc" || { echo "::error::hc executable missing"; exit 1; }
          chmod +x "$RUNNER_TEMP/mrf-hc/hc"
          "$RUNNER_TEMP/mrf-hc/hc" --version | tee "$RUNNER_TEMP/hc_version.txt"
          grep -q '0.6.1' "$RUNNER_TEMP/hc_version.txt" || { echo "::error::CLI version mismatch"; exit 1; }
          echo "$RUNNER_TEMP/mrf-hc" >> "$GITHUB_PATH"
      - name: Pack NEW isolated laboratory DNA and checksum
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mrf-g5-isolated-dna"
          mkdir -p "$root/wasm"
          cp experimental/mrf-kernel-lab/experimental_dna/dna.yaml "$root/dna.yaml"
          cp experimental/mrf-kernel-lab/zome_integrity_lab/target/wasm32-unknown-unknown/release/prometheus_mrf_integrity_lab.wasm "$root/wasm/"
          cp experimental/mrf-kernel-lab/zome_coordinator_lab/target/wasm32-unknown-unknown/release/prometheus_mrf_coordinator_lab.wasm "$root/wasm/"
          hc dna pack "$root"
          test -s "$root/prometheus_mrf_synthetic_lab.dna"
          (cd "$root" && sha256sum wasm/*.wasm prometheus_mrf_synthetic_lab.dna > SHA256SUMS.txt)
          cp "$RUNNER_TEMP/hc_version.txt" "$root/hc_version.txt"
          cp experimental/mrf-kernel-lab/zome_integrity_lab/Cargo.lock "$root/integrity_Cargo.lock"
          cp experimental/mrf-kernel-lab/zome_coordinator_lab/Cargo.lock "$root/coordinator_Cargo.lock"
          cat "$root/SHA256SUMS.txt"
          # This is an independent, source-controlled pin, not just a
          # checksum generated beside the artifact in this same CI run.
          (cd "$root" && printf '%s  %s\n' \
            "$G5_EXPECTED_COORDINATOR_SHA256" "wasm/prometheus_mrf_coordinator_lab.wasm" \
            "$G5_EXPECTED_INTEGRITY_SHA256" "wasm/prometheus_mrf_integrity_lab.wasm" \
            "$G5_EXPECTED_DNA_SHA256" "prometheus_mrf_synthetic_lab.dna" \
            | sha256sum -c -) || { echo "::error::Synthetic Gate-5 pinned DNA/WASM digest changed; FAIL CLOSED"; exit 1; }
          echo "G5_PINNED_DNA_AND_WASM_DIGESTS=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: mrf-gate5-new-dna-TEST-only
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mrf-g5-isolated-dna/dna.yaml
            ${{ runner.temp }}/mrf-g5-isolated-dna/prometheus_mrf_synthetic_lab.dna
            ${{ runner.temp }}/mrf-g5-isolated-dna/SHA256SUMS.txt
            ${{ runner.temp }}/mrf-g5-isolated-dna/hc_version.txt
            ${{ runner.temp }}/mrf-g5-isolated-dna/integrity_Cargo.lock
            ${{ runner.temp }}/mrf-g5-isolated-dna/coordinator_Cargo.lock
            ${{ runner.temp }}/mrf-g5-isolated-dna/wasm/*.wasm

  test-cross-peer-read:
    needs: pack-isolated-test-dna
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENSSL_NO_VENDOR: "1"
      GH_TOKEN: ${{ github.token }}
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: actions/download-artifact@v4
        with:
          name: mrf-gate5-new-dna-TEST-only
          path: ${{ runner.temp }}/mrf-g5-dna-tested
      - name: Verify downloaded exact TEST DNA and stage to isolated harness
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mrf-g5-dna-tested"
          (cd "$root" && sha256sum -c SHA256SUMS.txt)
          # This is an independent, source-controlled pin, not just a
          # checksum generated beside the artifact in this same CI run.
          (cd "$root" && printf '%s  %s\n' \
            "$G5_EXPECTED_COORDINATOR_SHA256" "wasm/prometheus_mrf_coordinator_lab.wasm" \
            "$G5_EXPECTED_INTEGRITY_SHA256" "wasm/prometheus_mrf_integrity_lab.wasm" \
            "$G5_EXPECTED_DNA_SHA256" "prometheus_mrf_synthetic_lab.dna" \
            | sha256sum -c -) || { echo "::error::Synthetic Gate-5 pinned DNA/WASM digest changed; FAIL CLOSED"; exit 1; }
          echo "G5_PINNED_DNA_AND_WASM_DIGESTS=PASS"
          test -s "$root/prometheus_mrf_synthetic_lab.dna"
          cp "$root/prometheus_mrf_synthetic_lab.dna" experimental/mrf-kernel-lab/experimental_dna/
          echo "G5_EXACT_DNA_SHA256=$(sha256sum "$root/prometheus_mrf_synthetic_lab.dna" | awk '{print $1}')"
      - name: Build and run bounded TEST-only two-conductor remote get
        run: |
          set -euo pipefail
          # Seed this standalone SweetConductor test from the exact Holochain
          # v0.6.1 release lock. Unpinned resolution pulled mutually incompatible
          # stable crypto crates; opportunistic downgrades pulled a yanked DER.
          # The upstream release lock contains the coherent dependency tuple.
          manifest=experimental/mrf-kernel-lab/conductor_tests/Cargo.toml
          lock=experimental/mrf-kernel-lab/conductor_tests/Cargo.lock
          gh api 'repos/holochain/holochain/contents/Cargo.lock?ref=3bdeaccd1c54fa351e76f7347601dfbc061d5bd4' --jq '.content' \
            | tr -d '\n' | base64 -d > "$lock"
          test "$(wc -c < "$lock")" -gt 200000
          grep -A2 'name = "ed25519-dalek"' "$lock" | tail -8
          echo "G5_UPSTREAM_HOLOCHAIN_061_LOCK_SHA256=$(sha256sum "$lock" | cut -d' ' -f1)"
          # The test's smaller workspace may trim nonused upstream packages.
          # Save the resulting resolved lockfile even if compilation fails.
          cargo test --manifest-path "$manifest" --test gate5_remote_action -- --nocapture --test-threads=1

      - name: Archive TEST harness dependency lockfile for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrf-gate5-conductor-test-lockfile
          if-no-files-found: warn
          retention-days: 7
          path: experimental/mrf-kernel-lab/conductor_tests/Cargo.lock
