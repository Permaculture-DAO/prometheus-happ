name: control-plane-integration

on:
  pull_request:
    paths:
      - 'zome_integrity/**'
      - 'zome_coordinator/**'
      - 'dnas/hearth/**'
      - 'integration_tests/**'
      - '.github/workflows/control-plane-integration.yml'
  workflow_dispatch:

jobs:
  conductor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: |
            . -> target
            integration_tests -> integration_tests/target
      - name: build zome wasm
        run: cargo build --locked --target wasm32-unknown-unknown --workspace
      - name: install hc 0.6.1
        run: cargo install holochain_cli --version 0.6.1 --locked --force
      - name: pack test DNA
        run: |
          mkdir -p dnas/hearth/wasm
          cp target/wasm32-unknown-unknown/debug/zome_integrity.wasm dnas/hearth/wasm/zome_integrity.wasm
          cp target/wasm32-unknown-unknown/debug/zome_coordinator.wasm dnas/hearth/wasm/zome_coordinator.wasm
          rm -f dnas/hearth/hearth.dna
          hc dna pack dnas/hearth
          test -f dnas/hearth/hearth.dna
          sha256sum dnas/hearth/hearth.dna
      - name: execute Sweettest conductor suite
        run: cargo test --locked --manifest-path integration_tests/Cargo.toml --test conductor -- --test-threads=1 --nocapture
