[package]
name = "integration_tests"
version = "0.1.0"
edition = "2021"
publish = false

# Host-only conductor tests (sweettest). Excluded from the workspace so the wasm
# zome build never pulls the holochain conductor.
[dependencies]

# Match the exact Holochain release used by the runtime and zome artifacts.
[dev-dependencies]
holochain = { version = "=0.6.1", features = ["sweettest"] }
holo_hash = "=0.6.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

holochain_types = "=0.6.1"

# Compatibility pins copied from the Holochain 0.6.1 release lock.
# Without these pins Cargo may resolve stable 3.0/0.11 crates that are API-incompatible
# with ed25519-dalek 3.0.0-pre.1 pulled by iroh-holochain 0.95.1.
ed25519 = "=3.0.0-rc.4"
signature = "=3.0.0-rc.10"
pkcs8 = "=0.11.0-rc.11"
