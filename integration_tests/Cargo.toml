[package]
name = "integration_tests"
version = "0.1.0"
edition = "2021"
publish = false

# Host-only conductor tests (sweettest). Excluded from the workspace so the wasm
# zome build never pulls the holochain conductor.
[dependencies]

# Match the installed conductor and the previously verified integration lock.
[dev-dependencies]
holochain = { version = "=0.6.1", features = ["sweettest"] }
holo_hash = "=0.6.1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
